<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trophibot — Live Monitor</title>
  <style>
    :root {
      --bg:        #0b0d12;
      --panel:     #161a22;
      --panel-2:   #1f2531;
      --border:    #262e3d;
      --text:      #e6e9ef;
      --text-dim:  #8a93a6;
      --accent:    #5865f2;
      --green:     #3ddc97;
      --yellow:    #f5b041;
      --red:       #ef5b5b;
      --purple:    #b388eb;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: var(--accent); }

    header {
      padding: 22px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--panel);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-dim);
    }

    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .conn-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .conn-pill.connected .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .conn-pill.disconnected .dot { background: var(--red); }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px;
      display: grid;
      gap: 24px;
    }

    h2 {
      margin: 0 0 14px 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }

    .card .label {
      font-size: 11px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 26px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .card .value-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-dim);
      box-shadow: 0 0 0 0 currentColor;
    }
    .status-online       { color: var(--green);  }
    .status-online       .status-dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .status-reconnecting { color: var(--yellow); }
    .status-reconnecting .status-dot { background: var(--yellow); animation: pulse 1.4s ease-in-out infinite; }
    .status-connecting   { color: var(--yellow); }
    .status-connecting   .status-dot { background: var(--yellow); animation: pulse 1.4s ease-in-out infinite; }
    .status-offline      { color: var(--red);    }
    .status-offline      .status-dot { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    .alerts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .alert-card {
      background: linear-gradient(135deg, rgba(88,101,242,0.10), rgba(179,136,235,0.10));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .alert-card .tag-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .alert-card .tag-count {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .activity {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .activity-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }
    .activity-list li {
      display: grid;
      grid-template-columns: 80px 60px 1fr;
      gap: 12px;
      align-items: baseline;
      padding: 10px 12px;
      background: var(--panel-2);
      border-radius: 8px;
      border-left: 3px solid var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .activity-list li.level-info    { border-left-color: var(--accent); }
    .activity-list li.level-success { border-left-color: var(--green);  }
    .activity-list li.level-warn    { border-left-color: var(--yellow); }
    .activity-list li.level-error   { border-left-color: var(--red);    }
    .activity-list li.level-alert   { border-left-color: var(--purple); background: rgba(179,136,235,0.08); }

    .activity-list .time {
      font-size: 12px;
      color: var(--text-dim);
    }
    .activity-list .badge {
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-dim);
    }
    .activity-list .msg { color: var(--text); }
    .empty {
      color: var(--text-dim);
      padding: 20px;
      text-align: center;
      font-size: 13px;
    }

    .commands-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .commands-table th,
    .commands-table td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .commands-table th {
      font-size: 11px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 600;
      background: var(--panel-2);
    }
    .commands-table tr:last-child td { border-bottom: none; }
    .cmd-name { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; color: var(--accent); }
    .perm-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .perm-badge.public { background: rgba(61,220,151,0.12); color: var(--green); }
    .perm-badge.admin  { background: rgba(239,91,91,0.12);  color: var(--red);   }

    footer {
      text-align: center;
      padding: 18px;
      color: var(--text-dim);
      font-size: 12px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .row-2 { grid-template-columns: 1fr; }
      header { padding: 18px 20px; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">T</div>
      <div>
        <div class="brand-title">Trophibot — Live Monitor</div>
        <div class="brand-subtitle" id="identity">connecting...</div>
      </div>
    </div>
    <div class="conn-pill disconnected" id="ws-pill">
      <span class="dot"></span>
      <span id="ws-status-text">Dashboard offline</span>
    </div>
  </header>

  <main>

    <!-- Status grid -->
    <section>
      <h2>Live status</h2>
      <div class="grid">
        <div class="card">
          <div class="label">Bot status</div>
          <div class="value-row" id="status-container">
            <span class="status-dot"></span>
            <span class="value" id="status-text">—</span>
          </div>
        </div>
        <div class="card">
          <div class="label">Uptime</div>
          <div class="value" id="uptime">00:00:00:00</div>
        </div>
        <div class="card">
          <div class="label">WebSocket ping</div>
          <div class="value" id="ping">— ms</div>
        </div>
        <div class="card">
          <div class="label">Guilds</div>
          <div class="value" id="guilds">—</div>
        </div>
      </div>
    </section>

    <!-- Tag alert counters -->
    <section>
      <h2>Forum tag alerts (case-sensitive)</h2>
      <div class="alerts" id="alerts-row">
        <!-- Populated by JS -->
      </div>
    </section>

    <div class="row-2">

      <!-- Activity log -->
      <section>
        <h2>Activity log <span id="activity-count" style="color: var(--text-dim); font-weight: 400; text-transform: none;"></span></h2>
        <div class="activity">
          <ul class="activity-list" id="activity-list">
            <li class="empty" style="grid-template-columns: 1fr;">Waiting for events...</li>
          </ul>
        </div>
      </section>

      <!-- Commands panel -->
      <section>
        <h2>Commands</h2>
        <table class="commands-table">
          <thead>
            <tr>
              <th>Command</th>
              <th>Description</th>
              <th>Access</th>
            </tr>
          </thead>
          <tbody id="commands-body">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </section>
    </div>

  </main>

  <footer>
    Trophibot monitor &middot; <span id="server-time">—</span>
  </footer>

  <script>
    'use strict';

    let snapshot = null;
    let ws = null;
    let wsReconnectDelay = 1000;
    const WS_RECONNECT_MAX = 30_000;

    // ----- Helpers ---------------------------------------------------------

    function pad(n) { return String(n).padStart(2, '0'); }

    function formatUptime(connectedAt) {
      if (!connectedAt) return '00:00:00:00';
      const ms = Math.max(0, Date.now() - connectedAt);
      const days  = Math.floor(ms / 86_400_000);
      const hours = Math.floor((ms % 86_400_000) / 3_600_000);
      const mins  = Math.floor((ms % 3_600_000) / 60_000);
      const secs  = Math.floor((ms % 60_000) / 1_000);
      return `${pad(days)}:${pad(hours)}:${pad(mins)}:${pad(secs)}`;
    }

    function formatTime(epochMs) {
      const d = new Date(epochMs);
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ----- WebSocket connection -------------------------------------------

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${proto}://${location.host}`;
      ws = new WebSocket(url);

      ws.addEventListener('open', () => {
        wsReconnectDelay = 1000;
        document.getElementById('ws-pill').classList.replace('disconnected', 'connected');
        document.getElementById('ws-status-text').textContent = 'Dashboard live';
      });

      ws.addEventListener('message', (e) => {
        let msg;
        try { msg = JSON.parse(e.data); }
        catch { return; }
        handleMessage(msg);
      });

      ws.addEventListener('close', () => {
        document.getElementById('ws-pill').classList.replace('connected', 'disconnected');
        document.getElementById('ws-status-text').textContent = 'Dashboard offline — reconnecting...';
        setTimeout(connect, wsReconnectDelay);
        wsReconnectDelay = Math.min(wsReconnectDelay * 2, WS_RECONNECT_MAX);
      });

      ws.addEventListener('error', () => { /* close handler runs after error */ });
    }

    function handleMessage(msg) {
      if (msg.type === 'snapshot') {
        snapshot = msg.data;
        renderAll();
      } else if (msg.type === 'event') {
        // Snapshot follows; let the snapshot render path handle log update.
      }
    }

    // ----- Rendering -------------------------------------------------------

    function renderAll() {
      if (!snapshot) return;

      // Status
      const container = document.getElementById('status-container');
      const statusText = document.getElementById('status-text');
      container.className = 'value-row status-' + snapshot.status;
      statusText.textContent = snapshot.status.charAt(0).toUpperCase() + snapshot.status.slice(1);

      // Identity
      document.getElementById('identity').textContent =
        snapshot.identity ? `Connected as ${snapshot.identity}` : 'Not connected';

      // Ping
      document.getElementById('ping').textContent =
        snapshot.ping >= 0 ? `${snapshot.ping} ms` : '— ms';

      // Guilds
      document.getElementById('guilds').textContent = snapshot.guildCount ?? '—';

      // Alerts
      const alertsRow = document.getElementById('alerts-row');
      alertsRow.innerHTML = '';
      for (const tag of snapshot.watchedTags) {
        const count = snapshot.alerts?.[tag] ?? 0;
        const node = document.createElement('div');
        node.className = 'alert-card';
        node.innerHTML = `
          <div>
            <div class="tag-name">${escapeHtml(tag)} tag</div>
            <div style="color: var(--text-dim); font-size: 12px;">Forum thread detections</div>
          </div>
          <div class="tag-count">${count}</div>
        `;
        alertsRow.appendChild(node);
      }

      // Activity log
      const list = document.getElementById('activity-list');
      const entries = snapshot.activityLog || [];
      const countEl = document.getElementById('activity-count');
      countEl.textContent = entries.length ? `(${entries.length} most recent)` : '';

      if (entries.length === 0) {
        list.innerHTML = '<li class="empty" style="grid-template-columns: 1fr;">Waiting for events...</li>';
      } else {
        list.innerHTML = entries.map(e => `
          <li class="level-${escapeHtml(e.level)}">
            <span class="time">${formatTime(e.timestamp)}</span>
            <span class="badge">${escapeHtml(e.level)}</span>
            <span class="msg">${escapeHtml(e.message)}</span>
          </li>
        `).join('');
      }

      // Commands
      const tbody = document.getElementById('commands-body');
      tbody.innerHTML = (snapshot.commands || []).map(c => `
        <tr>
          <td class="cmd-name">${escapeHtml(c.name)}</td>
          <td>${escapeHtml(c.description)}</td>
          <td><span class="perm-badge ${escapeHtml(c.permission)}">${c.permission === 'admin' ? 'Admin only' : 'Public'}</span></td>
        </tr>
      `).join('');

      // Server time footer
      document.getElementById('server-time').textContent = new Date(snapshot.serverTime).toLocaleString();
    }

    // Tick the uptime display every second locally (independent of WS pushes).
    setInterval(() => {
      if (snapshot) {
        document.getElementById('uptime').textContent = formatUptime(snapshot.connectedAt);
      }
    }, 1000);

    // Boot
    connect();
  </script>

</body>
</html>
